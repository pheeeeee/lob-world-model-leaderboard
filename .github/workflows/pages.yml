# Deploy the static site to GitHub Pages on every push to main (Pages source: "GitHub Actions").
# The site has no build step: the repository root IS the site, so the job just uploads it.
# The data/ files are pushed by the backend's `python -m evaluation_db publish`; each such
# push re-runs this workflow and the new database goes live within about a minute.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
